{{- $docs := where .Site.RegularPages "Section" "docs" -}}
{{- $sortedDocs := sort $docs "Weight" "asc" -}}
{{- $firstDoc := index $sortedDocs 0 -}}

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ .Site.Title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f4f7fb;
    }

    .jobs-docs-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f7fb;
    }

    .jobs-docs-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f4f7fb;
    }

    .jobs-audio-player {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 9999;
      width: 320px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(219, 228, 238, 0.95);
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(10px);
    }

    .jobs-audio-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .jobs-audio-title {
      color: #1f2937;
      font-size: 0.92rem;
      font-weight: 750;
    }

    .jobs-audio-unlock {
      display: none;
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      padding: 5px 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .jobs-audio-player.is-blocked .jobs-audio-unlock {
      display: inline-flex;
    }

    .jobs-audio-player audio {
      width: 100%;
      height: 36px;
    }

    @media screen and (max-width: 56rem) {
      .jobs-audio-player {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
      }
    }
  </style>
</head>

<body>
  <div class="jobs-docs-shell">
    {{- if $firstDoc }}
    <iframe
      class="jobs-docs-frame"
      name="jobs-docs-frame"
      src="{{ $firstDoc.RelPermalink }}"
      title="Jobs Docs"
      allow="autoplay">
    </iframe>
    {{- else }}
    <div style="padding: 24px;">暂无文档。</div>
    {{- end }}
  </div>

  <div class="jobs-audio-player" id="jobs-audio-player">
    <div class="jobs-audio-header">
      <div class="jobs-audio-title">🎵 With an Orchid</div>
      <button class="jobs-audio-unlock" id="jobs-audio-unlock" type="button">开启音乐</button>
    </div>
    <audio id="jobs-bg-music" controls autoplay loop preload="auto" playsinline>
      <source src="{{ "With an Orchid.mp3" | relURL }}" type="audio/mpeg">
      当前浏览器不支持 audio 标签。
    </audio>
  </div>

  <script>
    (function () {
      var audio = document.getElementById("jobs-bg-music");
      var player = document.getElementById("jobs-audio-player");
      var unlockButton = document.getElementById("jobs-audio-unlock");

      if (!audio) {
        return;
      }

      var storagePrefix = "jobsdocs.shellMusic.";
      var timeKey = storagePrefix + "currentTime";
      var volumeKey = storagePrefix + "volume";
      var defaultVolume = 0.42;
      var isUnlocked = false;

      function getNumberFromStorage(key, fallback) {
        var value = window.localStorage.getItem(key);
        var numberValue = Number(value);

        if (!Number.isFinite(numberValue)) {
          return fallback;
        }

        return numberValue;
      }

      function restoreVolume() {
        var volume = getNumberFromStorage(volumeKey, defaultVolume);

        if (volume <= 0 || volume > 1) {
          volume = defaultVolume;
        }

        audio.volume = volume;
      }

      function setBlocked(blocked) {
        if (!player) {
          return;
        }

        player.classList.toggle("is-blocked", blocked);
      }

      function restoreCurrentTime() {
        var savedTime = getNumberFromStorage(timeKey, 0);

        if (savedTime <= 0) {
          return;
        }

        try {
          if (Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = savedTime % audio.duration;
          } else {
            audio.currentTime = savedTime;
          }
        } catch (error) {
          // 某些浏览器 metadata 未就绪时，不允许设置 currentTime。
        }
      }

      function saveState() {
        if (Number.isFinite(audio.currentTime)) {
          window.localStorage.setItem(timeKey, String(audio.currentTime));
        }

        if (Number.isFinite(audio.volume) && !audio.muted) {
          window.localStorage.setItem(volumeKey, String(audio.volume));
        }
      }

      function startMutedAfterBlocked() {
        audio.muted = true;
        audio.defaultMuted = true;

        var mutedPromise = audio.play();

        if (mutedPromise && typeof mutedPromise.catch === "function") {
          mutedPromise.catch(function () {
            setBlocked(true);
          });
        }
      }

      function playAudible() {
        restoreVolume();
        audio.muted = false;
        audio.defaultMuted = false;

        var playPromise = audio.play();

        if (playPromise && typeof playPromise.then === "function") {
          playPromise.then(function () {
            isUnlocked = true;
            setBlocked(false);
          }).catch(function () {
            setBlocked(true);
            startMutedAfterBlocked();
          });
        } else {
          isUnlocked = true;
          setBlocked(false);
        }
      }

      function unlockByUserGesture() {
        restoreVolume();
        audio.muted = false;
        audio.defaultMuted = false;

        var playPromise = audio.play();

        if (playPromise && typeof playPromise.then === "function") {
          playPromise.then(function () {
            isUnlocked = true;
            setBlocked(false);
          }).catch(function () {
            setBlocked(true);
          });
        } else {
          isUnlocked = true;
          setBlocked(false);
        }
      }

      function handleFrameGesture(event) {
        if (!event.data || event.data.type !== "jobsdocs-user-gesture") {
          return;
        }

        unlockByUserGesture();
      }

      restoreVolume();

      audio.addEventListener("loadedmetadata", function () {
        restoreCurrentTime();
      });

      audio.addEventListener("play", function () {
        if (!audio.muted) {
          isUnlocked = true;
          setBlocked(false);
        }
      });

      audio.addEventListener("timeupdate", saveState);
      audio.addEventListener("volumechange", saveState);

      ["pointerdown", "click", "touchstart", "keydown"].forEach(function (eventName) {
        document.addEventListener(eventName, unlockByUserGesture, { once: true, capture: true });
      });

      if (unlockButton) {
        unlockButton.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          unlockByUserGesture();
        });
      }

      window.addEventListener("message", handleFrameGesture);
      window.addEventListener("pagehide", saveState);
      window.addEventListener("beforeunload", saveState);

      playAudible();
    })();
  </script>
</body>
</html>
