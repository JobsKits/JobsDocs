<!doctype html>
<html lang="zh-CN">
<head>
	<meta name="generator" content="Hugo 0.161.1"><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=53994&amp;path=livereload" data-no-instant defer></script>
  <meta charset="utf-8">
  <title>Jobs Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fb">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  <meta name="color-scheme" content="light dark">

  <style>
    :root {
      color-scheme: light dark;
      --jobs-shell-bg: #f4f7fb;
      --jobs-frame-bg: #f4f7fb;
      --jobs-player-bg: rgba(255, 255, 255, 0.94);
      --jobs-player-border: rgba(219, 228, 238, 0.95);
      --jobs-player-shadow: 0 12px 34px rgba(15, 23, 42, 0.16);
      --jobs-player-title: #1f2937;
      --jobs-player-hint: #64748b;
      --jobs-player-space: 0px;
      --jobs-safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --jobs-shell-bg: #0f172a;
        --jobs-frame-bg: #0f172a;
        --jobs-player-bg: rgba(17, 24, 39, 0.94);
        --jobs-player-border: rgba(51, 65, 85, 0.95);
        --jobs-player-shadow: 0 16px 38px rgba(0, 0, 0, 0.38);
        --jobs-player-title: #f9fafb;
        --jobs-player-hint: #cbd5e1;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--jobs-shell-bg);
    }

    .jobs-docs-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--jobs-shell-bg);
      box-sizing: border-box;
      padding-bottom: var(--jobs-player-space);
    }

    .jobs-docs-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--jobs-frame-bg);
    }

    .jobs-audio-player {
      position: fixed;
      left: 24px;
      bottom: calc(24px + var(--jobs-safe-bottom));
      z-index: 9999;
      width: 320px;
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--jobs-player-bg);
      border: 1px solid var(--jobs-player-border);
      box-shadow: var(--jobs-player-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-sizing: border-box;
    }

    .jobs-audio-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .jobs-audio-title {
      color: var(--jobs-player-title);
      font-size: 0.92rem;
      font-weight: 750;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jobs-audio-unlock {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 750;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
    }

    .jobs-audio-player.is-playing .jobs-audio-unlock {
      display: none;
    }

    .jobs-audio-hint {
      display: none;
      margin: 0 0 8px;
      color: var(--jobs-player-hint);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .jobs-audio-player.is-waiting-gesture .jobs-audio-hint,
    .jobs-audio-player.is-blocked .jobs-audio-hint {
      display: block;
    }

    .jobs-audio-player audio {
      width: 100%;
      height: 36px;
      display: block;
    }

    @media screen and (max-width: 56rem) {
      :root {
        --jobs-player-space: calc(116px + var(--jobs-safe-bottom));
      }

      .jobs-audio-player {
        left: 10px;
        right: 10px;
        bottom: calc(10px + var(--jobs-safe-bottom));
        width: auto;
        padding: 10px 12px;
        border-radius: 16px;
      }

      .jobs-audio-title {
        font-size: 0.88rem;
      }

      .jobs-audio-unlock {
        padding: 7px 12px;
        font-size: 0.8rem;
      }

      .jobs-audio-player audio {
        height: 34px;
      }

  </style>

<body>
  <div class="jobs-docs-shell">
    <iframe
      id="jobs-docs-frame"
      class="jobs-docs-frame"
      name="jobs-docs-frame"
      src="./docs/ios%E7%9B%B8%E5%85%B3%E7%9A%84%E6%96%87%E6%A1%A3%E5%92%8C%E8%B5%84%E6%96%99/%E5%85%B3%E4%BA%8Ewmzbanner%E7%9A%84%E6%80%AA%E5%BC%82%E5%86%99%E6%B3%95%E6%8E%A2%E7%A9%B6/"
      title="Jobs Docs"
      allow="autoplay">
    </iframe>
  </div>

  <div id="jobs-audio-player" class="jobs-audio-player is-waiting-gesture">
    <div class="jobs-audio-head">
      <div class="jobs-audio-title">🎵 With an Orchid</div>
      <button id="jobs-music-unlock" class="jobs-audio-unlock" type="button" aria-label="开启背景音乐">开启音乐</button>
    </div>
    <p id="jobs-audio-hint" class="jobs-audio-hint">移动端和新域名通常会禁止自动有声播放；点一下页面或按钮后才会出声。</p>
    <audio id="jobs-bg-music" controls loop preload="auto" playsinline>
      <source src="./With%20an%20Orchid.mp3" type="audio/mpeg">
      当前浏览器不支持 audio 标签。
    </audio>
  </div>

  <script>
    (function () {
      var audio = document.getElementById("jobs-bg-music");
      var frame = document.getElementById("jobs-docs-frame");
      var player = document.getElementById("jobs-audio-player");
      var unlockButton = document.getElementById("jobs-music-unlock");

      if (!audio) {
        return;
      }

      var storagePrefix = "jobsdocs.shellMusic.";
      var timeKey = storagePrefix + "currentTime";
      var volumeKey = storagePrefix + "volume";
      var defaultVolume = 0.42;
      var restoredCurrentTime = false;
      var blockedByPolicy = false;

      function getNumberFromStorage(key, fallback) {
        var value = window.localStorage.getItem(key);
        var numberValue = Number(value);

        if (!Number.isFinite(numberValue)) {
          return fallback;
        }

        return numberValue;
      }

      function setPlayerState(state) {
        if (!player) {
          return;
        }

        player.classList.remove("is-playing", "is-waiting-gesture", "is-blocked");
        player.classList.add(state);
      }

      function restoreVolume() {
        var volume = getNumberFromStorage(volumeKey, defaultVolume);

        if (volume <= 0 || volume > 1) {
          volume = defaultVolume;
        }

        audio.volume = volume;
        audio.muted = false;
        audio.defaultMuted = false;
      }

      function restoreCurrentTime() {
        if (restoredCurrentTime) {
          return;
        }

        restoredCurrentTime = true;
        var savedTime = getNumberFromStorage(timeKey, 0);

        if (savedTime <= 0) {
          return;
        }

        try {
          if (Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = savedTime % audio.duration;
          } else {
            audio.currentTime = savedTime;
          }
        } catch (error) {}
      }

      function saveState() {
        if (Number.isFinite(audio.currentTime)) {
          window.localStorage.setItem(timeKey, String(audio.currentTime));
        }

        if (Number.isFinite(audio.volume) && !audio.muted) {
          window.localStorage.setItem(volumeKey, String(audio.volume));
        }
      }

      function handlePlayBlocked() {
        blockedByPolicy = true;
        audio.muted = false;
        audio.defaultMuted = false;
        setPlayerState("is-blocked");
      }

      function handlePlayStarted() {
        blockedByPolicy = false;
        audio.muted = false;
        audio.defaultMuted = false;
        setPlayerState("is-playing");
      }

      function tryPlay() {
        restoreVolume();

        try {
          var playPromise = audio.play();

          if (playPromise && typeof playPromise.then === "function") {
            playPromise.then(handlePlayStarted).catch(handlePlayBlocked);
          } else if (!audio.paused) {
            handlePlayStarted();
          }
        } catch (error) {
          handlePlayBlocked();
        }
      }

      function unlock() {
        restoreVolume();
        tryPlay();
        return true;
      }

      function isTrustedFrameMessage(event) {
        if (event.origin && event.origin !== "null" && event.origin !== window.location.origin) {
          return false;
        }

        if (frame && event.source && event.source !== frame.contentWindow) {
          return false;
        }

        return true;
      }

      restoreVolume();
      setPlayerState("is-waiting-gesture");

      window.JobsDocsMusic = {
        unlock: unlock,
        unlockFromFrame: unlock,
        play: unlock,
        saveState: saveState
      };

      audio.addEventListener("loadedmetadata", function () {
        restoreCurrentTime();
        tryPlay();
      });

      audio.addEventListener("canplay", function () {
        if (!blockedByPolicy) {
          tryPlay();
        }
      }, { once: true });

      audio.addEventListener("play", handlePlayStarted);
      audio.addEventListener("playing", handlePlayStarted);
      audio.addEventListener("pause", function () {
        if (!audio.ended) {
          setPlayerState("is-waiting-gesture");
        }
      });
      audio.addEventListener("timeupdate", saveState);
      audio.addEventListener("volumechange", saveState);

      if (unlockButton) {
        ["pointerdown", "touchstart", "click"].forEach(function (eventName) {
          unlockButton.addEventListener(eventName, function (event) {
            event.preventDefault();
            event.stopPropagation();
            unlock();
          }, { capture: true });
        });
      }

      ["pointerdown", "touchstart", "keydown", "click"].forEach(function (eventName) {
        document.addEventListener(eventName, unlock, { capture: true });
      });

      window.addEventListener("message", function (event) {
        if (!isTrustedFrameMessage(event)) {
          return;
        }

        if (event.data && (
          event.data.type === "jobsdocs:unlock-music" ||
          event.data.type === "jobsdocs-user-gesture"
        )) {
          unlock();
        }
      });

      window.addEventListener("pagehide", saveState);
      window.addEventListener("beforeunload", saveState);

      tryPlay();
    })();
  </script>
</body>
</html>
