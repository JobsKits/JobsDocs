  <script>
    (function () {
      var audio = document.getElementById("jobs-bg-music");
      var frame = document.getElementById("jobs-docs-frame");
      var player = document.getElementById("jobs-audio-player");
      var unlockButton = document.getElementById("jobs-music-unlock");

      if (!audio) {
        return;
      }

      var storagePrefix = "jobsdocs.shellMusic.";
      var timeKey = storagePrefix + "currentTime";
      var volumeKey = storagePrefix + "volume";
      var defaultVolume = 0.42;
      var restoredCurrentTime = false;
      var blockedByPolicy = false;

      function getNumberFromStorage(key, fallback) {
        var value = window.localStorage.getItem(key);
        var numberValue = Number(value);

        if (!Number.isFinite(numberValue)) {
          return fallback;
        }

        return numberValue;
      }

      function setPlayerState(state) {
        if (!player) {
          return;
        }

        player.classList.remove("is-playing", "is-waiting-gesture", "is-blocked");
        player.classList.add(state);
      }

      function restoreVolume() {
        var volume = getNumberFromStorage(volumeKey, defaultVolume);

        if (volume <= 0 || volume > 1) {
          volume = defaultVolume;
        }

        audio.volume = volume;
        audio.muted = false;
        audio.defaultMuted = false;
      }

      function restoreCurrentTime() {
        if (restoredCurrentTime) {
          return;
        }

        restoredCurrentTime = true;
        var savedTime = getNumberFromStorage(timeKey, 0);

        if (savedTime <= 0) {
          return;
        }

        try {
          if (Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = savedTime % audio.duration;
          } else {
            audio.currentTime = savedTime;
          }
        } catch (error) {}
      }

      function saveState() {
        if (Number.isFinite(audio.currentTime)) {
          window.localStorage.setItem(timeKey, String(audio.currentTime));
        }

        if (Number.isFinite(audio.volume) && !audio.muted) {
          window.localStorage.setItem(volumeKey, String(audio.volume));
        }
      }

      function handlePlayBlocked() {
        blockedByPolicy = true;
        audio.muted = false;
        audio.defaultMuted = false;
        setPlayerState("is-blocked");
      }

      function handlePlayStarted() {
        blockedByPolicy = false;
        audio.muted = false;
        audio.defaultMuted = false;
        setPlayerState("is-playing");
      }

      function tryPlay() {
        restoreVolume();

        try {
          var playPromise = audio.play();

          if (playPromise && typeof playPromise.then === "function") {
            playPromise.then(handlePlayStarted).catch(handlePlayBlocked);
          } else if (!audio.paused) {
            handlePlayStarted();
          }
        } catch (error) {
          handlePlayBlocked();
        }
      }

      function unlock() {
        restoreVolume();
        tryPlay();
        return true;
      }

      function isTrustedFrameMessage(event) {
        if (event.origin && event.origin !== "null" && event.origin !== window.location.origin) {
          return false;
        }

        if (frame && event.source && event.source !== frame.contentWindow) {
          return false;
        }

        return true;
      }

      restoreVolume();
      setPlayerState("is-waiting-gesture");

      window.JobsDocsMusic = {
        unlock: unlock,
        unlockFromFrame: unlock,
        play: unlock,
        saveState: saveState
      };

      audio.addEventListener("loadedmetadata", function () {
        restoreCurrentTime();
        tryPlay();
      });

      audio.addEventListener("canplay", function () {
        if (!blockedByPolicy) {
          tryPlay();
        }
      }, { once: true });

      audio.addEventListener("play", handlePlayStarted);
      audio.addEventListener("playing", handlePlayStarted);
      audio.addEventListener("pause", function () {
        if (!audio.ended) {
          setPlayerState("is-waiting-gesture");
        }
      });
      audio.addEventListener("timeupdate", saveState);
      audio.addEventListener("volumechange", saveState);

      if (unlockButton) {
        ["pointerdown", "touchstart", "click"].forEach(function (eventName) {
          unlockButton.addEventListener(eventName, function (event) {
            event.preventDefault();
            event.stopPropagation();
            unlock();
          }, { capture: true });
        });
      }

      ["pointerdown", "touchstart", "keydown", "click"].forEach(function (eventName) {
        document.addEventListener(eventName, unlock, { capture: true });
      });

      window.addEventListener("message", function (event) {
        if (!isTrustedFrameMessage(event)) {
          return;
        }

        if (event.data && (
          event.data.type === "jobsdocs:unlock-music" ||
          event.data.type === "jobsdocs-user-gesture"
        )) {
          unlock();
        }
      });

      window.addEventListener("pagehide", saveState);
      window.addEventListener("beforeunload", saveState);

      tryPlay();
    })();

  <script>
    (function () {
      var frame = document.getElementById("jobs-docs-frame");
      var player = document.getElementById("jobs-audio-player") || document.querySelector(".jobs-audio-player");

      if (!frame || !player) {
        return;
      }

      if (!player.id) {
        player.id = "jobs-audio-player";
      }

      var handle = player.querySelector(".jobs-audio-head") || player.querySelector(".jobs-audio-title") || player;
      var margin = 12;
      var gap = 12;
      var mode = "docked";
      var dragState = null;
      var layoutRaf = 0;
      var hookedDoc = null;
      var floatingPosition = null;
      var initialReady = false;
      var initialDockTries = 0;
      var userDragged = false;

      player.classList.add("is-initial-positioning");
      player.classList.remove("is-layout-ready", "is-layout-animated");

      function frameDocument() {
        try {
          return frame.contentDocument || frame.contentWindow.document;
        } catch (error) {
          return null;
        }
      }

      function frameWindow() {
        try {
          return frame.contentWindow;
        } catch (error) {
          return null;
        }
      }

      function isMobileViewport() {
        var width = window.innerWidth || document.documentElement.clientWidth;

        if (width <= 896) {
          return true;
        }

        try {
          var win = frameWindow();
          return !!(win && win.matchMedia && win.matchMedia("screen and (max-width: 56rem)").matches);
        } catch (error) {
          return false;
        }
      }

      function visualViewportRect() {
        var vv = window.visualViewport;

        if (vv) {
          return {
            width: vv.width,
            height: vv.height,
            left: vv.offsetLeft || 0,
            top: vv.offsetTop || 0
          };
        }

        return {
          width: window.innerWidth || document.documentElement.clientWidth,
          height: window.innerHeight || document.documentElement.clientHeight,
          left: 0,
          top: 0
        };
      }

      function toViewportRect(rect) {
        var frameRect = frame.getBoundingClientRect();

        return {
          left: frameRect.left + rect.left,
          top: frameRect.top + rect.top,
          right: frameRect.left + rect.right,
          bottom: frameRect.top + rect.bottom,
          width: rect.width,
          height: rect.height
        };
      }

      function getMenu() {
        var doc = frameDocument();
        return doc ? doc.querySelector(".book-menu") : null;
      }

      function getSearch() {
        var doc = frameDocument();
        return doc ? doc.querySelector(".book-search") : null;
      }

      function visibleEnough(rect) {
        var viewportWidth = window.innerWidth || document.documentElement.clientWidth;
        var viewportHeight = window.innerHeight || document.documentElement.clientHeight;

        return (
          rect &&
          rect.width > 120 &&
          rect.height > 40 &&
          rect.right > 0 &&
          rect.left < viewportWidth &&
          rect.bottom > -300 &&
          rect.top < viewportHeight + 300

      }

      function getMenuRect() {
        var menu = getMenu();

        if (!menu) {
          return null;
        }

        var rect = toViewportRect(menu.getBoundingClientRect());

        if (!visibleEnough(rect) || rect.width < 220) {
          return null;
        }

        return rect;
      }

      function ensureDockSpace() {
        var doc = frameDocument();
        var search = getSearch();

        if (!doc || !search || !search.parentNode) {
          return null;
        }

        var space = doc.getElementById("jobs-audio-dock-space");

        if (!space) {
          space = doc.createElement("div");
          space.id = "jobs-audio-dock-space";
          space.className = "jobs-audio-dock-space";
        }

        if (space.nextElementSibling !== search) {
          search.parentNode.insertBefore(space, search);
        }

        return space;
      }

      function setDockSpace(active) {
        var doc = frameDocument();
        var space = ensureDockSpace();

        if (!doc || !space) {
          return;
        }

        doc.body.classList.toggle("jobs-audio-docked-in-menu", active);
        doc.body.classList.toggle("jobs-audio-undocked-from-menu", !active);
        space.classList.toggle("is-active", active);
        space.style.height = active ? Math.ceil(player.offsetHeight + gap) + "px" : "0px";
      }

      function getDockSlot() {
        var doc = frameDocument();
        var menuRect = getMenuRect();
        var search = getSearch();

        if (!doc || !menuRect || !search) {
          return null;
        }

        var space = ensureDockSpace();

        if (!space) {
          return null;
        }

        var searchRect = toViewportRect(search.getBoundingClientRect());
        var spaceRect = toViewportRect(space.getBoundingClientRect());

        if (!visibleEnough(searchRect) || searchRect.width < 180) {
          return null;
        }

        return {
          left: searchRect.left,
          top: spaceRect.top,
          width: searchRect.width,
          menuLeft: menuRect.left,
          menuRight: menuRect.right,
          menuTop: menuRect.top,
          menuBottom: menuRect.bottom
        };
      }

      function floatingWidth() {
        var viewport = visualViewportRect();
        return Math.max(280, Math.min(380, viewport.width - margin * 2));
      }

      function mobileWidth() {
        var viewport = visualViewportRect();
        return Math.max(280, Math.min(420, viewport.width - 24));
      }

      function clampFloating(x, y, width, height) {
        var viewport = visualViewportRect();
        var maxX = Math.max(viewport.left + margin, viewport.left + viewport.width - width - margin);
        var maxY = Math.max(viewport.top + margin, viewport.top + viewport.height - height - margin);

        return {
          x: Math.min(Math.max(x, viewport.left + margin), maxX),
          y: Math.min(Math.max(y, viewport.top + margin), maxY)
        };
      }

      function markReady() {
        if (initialReady) {
          return;
        }

        initialReady = true;
        player.classList.add("is-layout-ready");

        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            player.classList.remove("is-initial-positioning");
            player.classList.add("is-layout-animated");
          });
        });
      }

      function applyDockPosition(slot) {
        player.style.width = Math.round(slot.width) + "px";
        player.style.left = Math.round(slot.left) + "px";
        player.style.top = Math.round(slot.top) + "px";
        player.style.right = "auto";
        player.style.bottom = "auto";
        markReady();
      }

      function applyMobileDefaultPosition() {
        mode = "mobile-default";
        player.classList.add("is-mobile-default");
        player.classList.remove("is-docked", "is-floating", "is-dragging", "is-dock-candidate");
        setDockSpace(false);

        var width = mobileWidth();
        player.style.width = Math.round(width) + "px";

        var viewport = visualViewportRect();
        var rect = player.getBoundingClientRect();
        var bottomGap = 18;
        var x = viewport.left + (viewport.width - width) / 2;
        var y = viewport.top + viewport.height - rect.height - bottomGap;

        player.style.left = Math.round(x) + "px";
        player.style.top = Math.round(Math.max(viewport.top + margin, y)) + "px";
        player.style.right = "auto";
        player.style.bottom = "auto";

        markReady();
      }

      function applyFloatingPosition(x, y, width) {
        if (width) {
          player.style.width = Math.round(width) + "px";
        }

        var rect = player.getBoundingClientRect();
        var next = clampFloating(x, y, rect.width, rect.height);

        player.style.left = Math.round(next.x) + "px";
        player.style.top = Math.round(next.y) + "px";
        player.style.right = "auto";
        player.style.bottom = "auto";

        floatingPosition = {
          x: next.x,
          y: next.y,
          width: rect.width
        };

        markReady();
      }

      function retryInitialDock() {
        initialDockTries += 1;

        if (initialDockTries <= 35) {
          window.setTimeout(function () {
            dockPlayer(true);
          }, initialDockTries < 10 ? 50 : 120);
        }
      }

      function dockPlayer(isInitial) {
        if (isMobileViewport() && !userDragged) {
          applyMobileDefaultPosition();
          return;
        }

        mode = "docked";
        player.classList.add("is-docked");
        player.classList.remove("is-floating", "is-mobile-default", "is-dragging", "is-dock-candidate");

        setDockSpace(true);

        window.requestAnimationFrame(function () {
          setDockSpace(true);

          var slot = getDockSlot();

          if (!slot) {
            if (isInitial && !initialReady) {
              retryInitialDock();
            }
            return;
          }

          applyDockPosition(slot);
        });
      }

      function floatPlayer(x, y, width) {
        mode = "floating";
        player.classList.add("is-floating");
        player.classList.remove("is-docked", "is-mobile-default", "is-dragging", "is-dock-candidate");
        setDockSpace(false);

        var rect = player.getBoundingClientRect();
        var nextWidth = width || Math.max(280, Math.min(rect.width || floatingWidth(), floatingWidth()));
        var viewport = visualViewportRect();
        var nextX = typeof x === "number" ? x : viewport.left + viewport.width - nextWidth - margin;
        var nextY = typeof y === "number" ? y : viewport.top + viewport.height - rect.height - margin;

        applyFloatingPosition(nextX, nextY, nextWidth);
      }

      function snapFloating(x, y) {
        var rect = player.getBoundingClientRect();
        var viewport = visualViewportRect();
        var nextX = (x + rect.width / 2) < (viewport.left + viewport.width / 2)
          ? viewport.left + margin
          : viewport.left + viewport.width - rect.width - margin;

        floatPlayer(nextX, y, rect.width);
      }

      function shouldDockAt(x, y, width, height) {
        if (isMobileViewport()) {
          return false;
        }
