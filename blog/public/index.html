      }

      var storagePrefix = "jobsdocs.shellMusic.";
      var timeKey = storagePrefix + "currentTime";
      var volumeKey = storagePrefix + "volume";
      var defaultVolume = 0.42;
      var restoredCurrentTime = false;
      var blockedByPolicy = false;

      function getNumberFromStorage(key, fallback) {
        var value = window.localStorage.getItem(key);
        var numberValue = Number(value);

        if (!Number.isFinite(numberValue)) {

        }

      function setPlayerState(state) {
        if (!player) {
          return;
        }

        player.classList.remove("is-playing", "is-waiting-gesture", "is-blocked");
        player.classList.add(state);

      function restoreVolume() {
        var volume = getNumberFromStorage(volumeKey, defaultVolume);

        if (volume <= 0 || volume > 1) {
          volume = defaultVolume;
        }

        audio.volume = volume;
        audio.muted = false;
        audio.defaultMuted = false;
      }

      function restoreCurrentTime() {
        if (restoredCurrentTime) {
          return;
        }

        restoredCurrentTime = true;
        var savedTime = getNumberFromStorage(timeKey, 0);

        if (savedTime <= 0) {
          return;
        }

        try {
          if (Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = savedTime % audio.duration;
          } else {
            audio.currentTime = savedTime;
          }
        } catch (error) {}
      }

      function saveState() {
        if (Number.isFinite(audio.currentTime)) {
          window.localStorage.setItem(timeKey, String(audio.currentTime));
        }

        if (Number.isFinite(audio.volume) && !audio.muted) {
          window.localStorage.setItem(volumeKey, String(audio.volume));
        }
      }

      function handlePlayBlocked() {
        blockedByPolicy = true;
        audio.muted = false;
        audio.defaultMuted = false;
        setPlayerState("is-blocked");
      }

      function handlePlayStarted() {
        blockedByPolicy = false;
        audio.muted = false;
        audio.defaultMuted = false;
        setPlayerState("is-playing");
      }

      function tryPlay() {
        restoreVolume();

        try {
          var playPromise = audio.play();

          if (playPromise && typeof playPromise.then === "function") {
            playPromise.then(handlePlayStarted).catch(handlePlayBlocked);
          } else if (!audio.paused) {
            handlePlayStarted();
          }
        } catch (error) {
          handlePlayBlocked();
        }
      }

      function unlock() {
        restoreVolume();
        tryPlay();
        return true;
      }

      function isTrustedFrameMessage(event) {
        if (event.origin && event.origin !== "null" && event.origin !== window.location.origin) {

      setPlayerState("is-waiting-gesture");

      window.JobsDocsMusic = {
        unlock: unlock,
        unlockFromFrame: unlock,
        play: unlock,
        saveState: saveState
      };

      audio.addEventListener("loadedmetadata", function () {
        restoreCurrentTime();
        tryPlay();
      });

      audio.addEventListener("canplay", function () {
        if (!blockedByPolicy) {
          tryPlay();
        }
      }, { once: true });

      audio.addEventListener("play", handlePlayStarted);
      audio.addEventListener("playing", handlePlayStarted);
      audio.addEventListener("pause", function () {
        if (!audio.ended) {
          setPlayerState("is-waiting-gesture");
        }
      });
      audio.addEventListener("timeupdate", saveState);
      audio.addEventListener("volumechange", saveState);

      if (unlockButton) {
        ["pointerdown", "touchstart", "click"].forEach(function (eventName) {
          unlockButton.addEventListener(eventName, function (event) {
            event.preventDefault();
            event.stopPropagation();
            unlock();
          }, { capture: true });
        });
      }

      ["pointerdown", "touchstart", "keydown", "click"].forEach(function (eventName) {
        document.addEventListener(eventName, unlock, { capture: true });
      });

      window.addEventListener("message", function (event) {
        if (!isTrustedFrameMessage(event)) {
          return;
        }

        if (event.data && (
          event.data.type === "jobsdocs:unlock-music" ||
          event.data.type === "jobsdocs-user-gesture"
        )) {
          unlock();
        }
      });

      window.addEventListener("pagehide", saveState);
      window.addEventListener("beforeunload", saveState);

      tryPlay();
    })();

            syncLayoutSoon();
          }
        }, 80);
      });

      window.addEventListener("message", function (event) {
        if (event.origin && event.origin !== "null" && event.origin !== window.location.origin) {
          return;
        }

        if (event.data && event.data.type === "jobsdocs:layout-change") {
          syncLayoutSoon();
        }
      });

      window.addEventListener("resize", syncLayoutSoon);
      window.addEventListener("orientationchange", function () {
        window.setTimeout(syncLayoutSoon, 180);
      });

      window.JobsDocsMusicLayout = {
        dock: dockPlayer,
        float: function () { floatPlayer(); },
        sync: syncLayoutSoon
      };

      window.setTimeout(function () {
        hookFrameMenu();
        dockPlayer();
      }, 120);
    })();
  </script>
</body>
</html>
