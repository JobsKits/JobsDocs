name: Generate Mermaid Diagrams

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mermaid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MERMAID_INPUT: README.md
  MERMAID_OUTPUT: diagram.png
  MERMAID_CLI_VERSION: 11.16.0

jobs:
  verify:
    name: Verify Mermaid rendering
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Render diagrams without writing to the repository
        run: |
          npx --yes "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}" \
            --input "${MERMAID_INPUT}" \
            --output "${RUNNER_TEMP}/${MERMAID_OUTPUT}"

  publish:
    name: Publish Mermaid diagrams
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate diagrams
        run: |
          npx --yes "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}" \
            --input "${MERMAID_INPUT}" \
            --output "${MERMAID_OUTPUT}"
      - name: Commit generated diagrams when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -d '' generated_files < <(find . -maxdepth 1 -type f -name 'diagram*.png' -print0)
          if (( ${#generated_files[@]} == 0 )); then
            echo 'No generated diagram files.'
            exit 1
          fi
          git add -- "${generated_files[@]}"
          if git diff --cached --quiet; then
            echo 'No generated diagram changes.'
            exit 0
          fi
          git commit -m 'docs: update generated Mermaid diagrams'
          git push
