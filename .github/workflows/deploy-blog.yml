name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-blog-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.161.1
  HUGO_SHA256: 9b82cf3211b2321f189a005dd157e6f4bd5c65f2bf5e9eefd2f5e0803c12103c

jobs:
  generate:
    name: Generate and commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Hugo
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          printf '%s  %s\n' "${HUGO_SHA256}" "${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" hugo
          chmod +x "${RUNNER_TEMP}/hugo"
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Generate blog files
        shell: bash
        run: |
          chmod +x blog/install.command
          ./blog/install.command --ci

      - name: Commit generated files
        shell: bash
        run: |
          git add --all -- blog

          if git diff --cached --quiet; then
            echo "Blog files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(blog): 自动生成站点产物"
          git push origin HEAD:main
