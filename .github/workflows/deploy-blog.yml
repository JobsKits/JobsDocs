name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-blog-production
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.161.1
  HUGO_SHA256: 9b82cf3211b2321f189a005dd157e6f4bd5c65f2bf5e9eefd2f5e0803c12103c

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Hugo
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          printf '%s  %s\n' "${HUGO_SHA256}" "${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" hugo
          chmod +x "${RUNNER_TEMP}/hugo"
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Sync JobsDocs content
        shell: bash
        env:
          BLOG_DIR: ${{ github.workspace }}/blog
          ROOT_DIR: ${{ github.workspace }}
        run: |
          chmod +x blog/sync_docs.sh
          ./blog/sync_docs.sh

      - name: Build Hugo site
        shell: bash
        working-directory: blog
        run: hugo --gc --minify --baseURL "https://jobsdocs.ccwu.cc/"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy blog/public --project-name=jobsdocs --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
